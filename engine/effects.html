<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('/fonts/Inter.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Anton'; src: url('/fonts/Anton-Regular.ttf'); }
@font-face { font-family: 'Playfair'; src: url('/fonts/PlayfairDisplay-Italic.ttf'); font-style: italic; font-weight: 400 900; }
@font-face { font-family: 'Space Mono'; src: url('/fonts/SpaceMono-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Marker'; src: url('/fonts/PermanentMarker-Regular.ttf'); }
@font-face { font-family: 'Archivo Black'; src: url('/fonts/ArchivoBlack-Regular.ttf'); }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// claude-reel-effects: the 25 effects, drawn one frame at a time by scripts/reelfx.py.
// Each frame gets the video frame (head), the person cut-out (matte, RGBA), the clean background plate of its window
// and the face box. Every effect is a function of (s = seconds into the effect, d = its length), so renders repeat exactly.
const W = 1080, H = 1920;
let F = { x: 540, y: 600, w: 300 };            // face centre and width, per frame
let PLAN = { effects: [], words: [] };
const UI = "'Inter', sans-serif", BIG = "'Anton', sans-serif", SERIF = "'Playfair', serif", MONO = "'Space Mono', monospace", MARK = "'Marker', cursive", STAMP = "'Archivo Black', sans-serif";
const BLUSH = '#deb4b4', ROSE = '#b8606f';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const L = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rng = seed => { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const rr = (c, x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const split = (v, def) => String(v ?? def).split('|').map(x => x.trim()).filter(Boolean);
const IMG = {};
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('could not load ' + src)); i.src = src; });

window.init = async (plan, statics) => {
  PLAN = plan;
  for (const [k, v] of Object.entries(statics)) IMG[k] = await load(v);
  await Promise.all(["400 20px Inter", "800 20px Inter", "20px Anton", "italic 700 20px Playfair", "700 20px 'Space Mono'", "20px Marker", "20px 'Archivo Black'"].map(f => document.fonts.load(f)));
  return true;
};

// ---------- shared drawing ----------
const drawAt = (img, s, cx = F.x, cy = F.y, c = ctx) => { c.save(); c.translate(cx, cy); c.scale(s, s); c.translate(-cx, -cy); c.drawImage(img, 0, 0, W, H); c.restore(); };
const pulled = (matte, s) => {   // the cut-out scaled about the bottom centre, side edges feathered
  const l = L(), c = l.getContext('2d');
  c.translate(540, H); c.scale(s, s); c.translate(-540, -H); c.drawImage(matte, 0, 0, W, H);
  if (s < 0.999) {
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'destination-out';
    const x0 = 540 - 540 * s, x1 = 540 + 540 * s;
    let g = c.createLinearGradient(x0, 0, x0 + 90, 0); g.addColorStop(0, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x0, 0, 90, H);
    g = c.createLinearGradient(x1 - 90, 0, x1, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000'); c.fillStyle = g; c.fillRect(x1 - 90, 0, 90, H);
  }
  return l;
};
const pullFor = () => (F.w > 300 ? 1 : 0);   // tight framings get pulled back so words fit behind the head
const blurred = (img, px, s = 1.06) => { const l = L(540, 960), c = l.getContext('2d'); c.filter = `blur(${px / 2}px)`; c.translate(270, 480); c.scale(s, s); c.translate(-270, -480); c.drawImage(img, 0, 0, 540, 960); return l; };
const star4 = (c, x, y, r, a) => { c.save(); c.translate(x, y); c.rotate(a || 0); c.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * 0.22 : r, an = i * Math.PI / 4; c.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } c.closePath(); c.fill(); c.restore(); };
const vignette = (a) => { const g = ctx.createRadialGradient(540, 860, 300, 540, 900, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
const txt = (s, x, y, font, col, align = 'left') => { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); };
const fitSize = (str, tpl, maxW, max) => { const step = max >= 60 ? 4 : 1, min = Math.max(10, max * 0.3); let s = max; for (; s > min; s -= step) { ctx.font = tpl.replace('{}', s); if (ctx.measureText(str).width <= maxW) break; } return s; };
const faceCrop = (h, x, y, r) => { ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); const k = F.w * 0.72; ctx.drawImage(h, F.x - k / 2, F.y - k * 0.55, k, k, x - r, y - r, r * 2, r * 2); ctx.restore(); };
const side = () => (F.x < 540 ? 1 : -1);        // which side has more room: +1 = right
const sideX = (w) => (side() > 0 ? Math.min(W - 60 - w, F.x + F.w * 0.62) : Math.max(60, F.x - F.w * 0.62 - w));
const headTop = () => F.y - F.w * 0.95;

// ---------- 1. glass-widgets ----------
function glassCard(bl, x, y, w, h, r, k) {
  if (k <= 0) return false;
  ctx.save(); ctx.globalAlpha = clamp(k); ctx.translate(0, (1 - k) * 46);
  rr(ctx, x, y, w, h, r); ctx.save(); ctx.clip(); ctx.drawImage(bl, 0, 0, W, H); ctx.fillStyle = 'rgba(255,255,255,0.24)'; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
  rr(ctx, x + 1, y + 1, w - 2, h - 2, r); ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 2; ctx.stroke();
  return true;
}
function fxGlass(s, d, h, m, p, o) {
  ctx.drawImage(h, 0, 0, W, H);
  const bl = blurred(h, 40), k = i => eo((s - 0.05 - i * 0.07) / 0.28), shadow = () => { ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 10; };
  let i = 0;
  if (o.text && glassCard(bl, 60, 250, 250, 236, 28, k(i++))) {
    shadow(); const raw = String(o.text), n = parseFloat(raw.replace(/,/g, '')), shown = /^\d+$/.test(raw) ? String(Math.round(n * eo((s - 0.1) / 0.6))) : raw;
    const sz = fitSize(shown, `800 {}px ${UI}`, 210, 118);
    txt(shown, 82, 410, `800 ${sz}px ${UI}`, '#fff'); txt(o.label || '', 86, 452, `500 26px ${UI}`, 'rgba(255,255,255,0.92)'); ctx.restore();
  }
  if (glassCard(bl, 770, 250, 250, 124, 26, k(i++))) {
    shadow(); ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(798, 290, 8, 0, 7); ctx.fill(); txt('Rendering', 814, 299, `600 26px ${UI}`, '#fff');
    const pr = 0.35 + 0.62 * eo((s - 0.2) / Math.min(0.8, d)); ctx.shadowBlur = 0;
    rr(ctx, 794, 318, 202, 10, 5); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill(); rr(ctx, 794, 318, 202 * pr, 10, 5); ctx.fillStyle = '#fff'; ctx.fill();
    txt(`4K render · ${Math.round(pr * 100)}%`, 794, 356, `500 19px ${UI}`, 'rgba(255,255,255,0.88)'); ctx.restore();
  }
  let y = 392;
  if (o.name || o.handle) {
    if (glassCard(bl, 770, y, 250, 112, 26, k(i++))) {
      shadow(); const nm = o.name || o.handle, ns = fitSize(nm, `700 {}px ${UI}`, 128, 30);
      txt(nm, 794, o.handle && o.name ? 442 : 458, `700 ${ns}px ${UI}`, '#fff');
      if (o.handle && o.name) txt(o.handle, 794, 474, `500 ${fitSize(o.handle, `500 {}px ${UI}`, 128, 19)}px ${UI}`, 'rgba(255,255,255,0.88)');
      ctx.shadowBlur = 0; faceCrop(h, 966, y + 56, 34); ctx.beginPath(); ctx.arc(966, y + 56, 34, 0, 7); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    }
    y += 130;
  }
  if (glassCard(bl, 770, y, 250, 120, 26, k(i++))) {
    rr(ctx, 790, y + 22, 76, 76, 18); ctx.fillStyle = '#d97757'; ctx.fill(); ctx.fillStyle = '#fff'; star4(ctx, 828, y + 60, 28, s * 1.5);
    shadow(); txt('Made with', 880, y + 52, `500 20px ${UI}`, 'rgba(255,255,255,0.9)'); txt('Claude', 880, y + 84, `700 30px ${UI}`, '#fff'); ctx.restore();
  }
  const kp = k(i);
  if (kp > 0) {
    ctx.save(); ctx.globalAlpha = kp; rr(ctx, 380, 1660, 320, 62, 31); ctx.save(); ctx.clip(); ctx.drawImage(bl, 0, 0, W, H); ctx.fillStyle = 'rgba(30,20,22,0.38)'; ctx.fillRect(380, 1660, 320, 62); ctx.restore();
    rr(ctx, 381, 1661, 318, 60, 30); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `600 26px ${UI}`; const a = 'Edited by ', w1 = ctx.measureText(a).width; ctx.font = `800 26px ${UI}`; const w2 = ctx.measureText('Claude').width, x0 = 540 - (w1 + w2) / 2;
    txt(a, x0, 1700, `600 26px ${UI}`, '#fff'); txt('Claude', x0 + w1, 1700, `800 26px ${UI}`, BLUSH); ctx.restore();
  }
}

// ---------- 2. vertigo ----------
function fxVertigo(s, d, h, m, p) {
  const q = eio(s / Math.min(d, 1.6)), bs = 1 + 0.62 * q;
  const pb = blurred(p, 10, 1);
  ctx.drawImage(pb, 0, 0, W, H);
  for (let i = 0; i < 5; i++) { ctx.globalAlpha = i ? 0.3 : 1; drawAt(pb, bs * (1 + i * 0.03 * Math.sin(q * Math.PI)), F.x, F.y + 70); }
  ctx.globalAlpha = 1; drawAt(m, 1 - 0.03 * q, F.x, H);
}

// ---------- 3. orbit ----------
function fxOrbit(s, d, h, m) {
  ctx.drawImage(h, 0, 0, W, H);
  const n = Math.min(8, Number(PLAN.thumbs) || 6), cards = [], k = eo(s / 0.14), turn = s * Math.min(4.9, 2.0 / Math.max(d, 0.3)), sz = clamp(F.w / 470, 0.65, 1.05);
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n + 0.35 + turn, z = Math.sin(a);
    cards.push({ t: 't' + i, z, x: 540 + 420 * Math.cos(a), y: F.y + 260 * sz + 330 * z, sc: (0.78 + 0.26 * z) * k * sz, rot: (i % 2 ? 1 : -1) * (0.08 + 0.05 * (i % 3)) + Math.cos(a) * 0.12 });
  }
  const card = c => {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(c.sc, c.sc); ctx.globalAlpha = clamp(k * (0.75 + 0.25 * (c.z + 1) / 2));
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10; rr(ctx, -103, -180, 206, 360, 18); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.save(); rr(ctx, -95, -172, 190, 338, 12); ctx.clip(); const im = IMG[c.t], ar = im.width / im.height, tw = ar > 190 / 338 ? 338 * ar : 190, th = ar > 190 / 338 ? 338 : 190 / ar; ctx.drawImage(im, -tw / 2, -3 - th / 2, tw, th); ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; rr(ctx, -82, 128, 46, 26, 13); ctx.fill(); txt('▶', -66, 147, `700 16px ${UI}`, '#fff');
    ctx.restore();
  };
  cards.filter(c => c.z < 0).sort((a, b) => a.z - b.z).forEach(card);
  ctx.drawImage(m, 0, 0, W, H);
  cards.filter(c => c.z >= 0).sort((a, b) => a.z - b.z).forEach(card);
}

// ---------- 4. lockdown ----------
function fxLock(s, d, h, m, p, o) {
  const z = 1 + (Number(o.zoom) || 0.09) * eo(s / 0.22), sh = 7 * Math.sin(s * 55) * Math.exp(-s * 9);
  ctx.save(); ctx.translate(sh, 0); drawAt(h, z); ctx.restore();
  const k = back(s / 0.26), sc = 1.7 - 0.7 * k, bw = F.w * 0.95 * z * sc, bh = F.w * 1.1 * z * sc, cx = F.x, cy = F.y - F.w * 0.06, x = cx - bw / 2, y = cy - bh / 2, cl = 64;
  ctx.save(); ctx.globalAlpha = clamp(s / 0.06); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'square'; ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8;
  [[x, y, 1, 1], [x + bw, y, -1, 1], [x, y + bh, 1, -1], [x + bw, y + bh, -1, -1]].forEach(([px, py, dx, dy]) => { ctx.beginPath(); ctx.moveTo(px, py + dy * cl); ctx.lineTo(px, py); ctx.lineTo(px + dx * cl, py); ctx.stroke(); });
  if (s > 0.22) { ctx.globalAlpha = clamp((s - 0.22) / 0.1); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 16, cy); ctx.lineTo(cx + 16, cy); ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy + 16); ctx.stroke();
    if (o.text) { ctx.shadowBlur = 0; ctx.font = `700 24px ${MONO}`; const tw = ctx.measureText(String(o.text).toUpperCase()).width; rr(ctx, x, y + bh + 14, tw + 32, 44, 8); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill(); txt(String(o.text).toUpperCase(), x + 16, y + bh + 45, `700 24px ${MONO}`, '#fff'); } }
  ctx.restore();
}

// ---------- 5. paper-cut ----------
let PAPER = null;
function paperBg() {
  if (PAPER) return PAPER;
  const l = L(), c = l.getContext('2d'), r = rng(7);
  c.fillStyle = '#d8c6a2'; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 26000; i++) { c.fillStyle = r() < 0.5 ? 'rgba(90,60,30,0.07)' : 'rgba(255,250,235,0.08)'; c.fillRect(r() * W, r() * H, 2 + r() * 3, 2 + r() * 3); }
  return (PAPER = l);
}
function sticker(drawFn, outline = 9) {
  const a = L(), c = a.getContext('2d'); drawFn(c);
  const o = L(), oc = o.getContext('2d');
  for (let i = 0; i < 16; i++) { const an = i * Math.PI / 8; oc.drawImage(a, Math.cos(an) * outline, Math.sin(an) * outline); }
  oc.globalCompositeOperation = 'source-in'; oc.fillStyle = '#fff'; oc.fillRect(0, 0, W, H);
  oc.globalCompositeOperation = 'source-over'; oc.drawImage(a, 0, 0);
  return o;
}
const PSTK = {};
function paperStickers(head) {
  if (PSTK[head]) return PSTK[head];
  const r = rng(11);
  const news = sticker(c => {
    c.save(); c.translate(885, 560); c.rotate(0.06); c.scale(0.6, 0.6); c.fillStyle = '#efe6d2'; c.fillRect(-230, -190, 460, 380);
    c.fillStyle = '#1c1712'; c.font = `italic 700 46px ${SERIF}`; c.textAlign = 'center'; c.fillText('The Daily Prompt', 0, -128);
    c.fillRect(-210, -112, 420, 3); c.font = `700 12px ${MONO}`; c.fillText('VOL. I · EXTRA EDITION', 0, -94);
    let sz = 70; for (; sz > 24; sz -= 4) { c.font = `${sz}px ${STAMP}`; if (c.measureText(head).width <= 410) break; }
    c.fillText(head, 0, -30); c.font = `italic 700 30px ${SERIF}`; c.fillText('Edited by Claude', 0, 14);
    c.fillStyle = 'rgba(28,23,18,0.55)'; for (let col = 0; col < 3; col++) for (let ln = 0; ln < 9; ln++) c.fillRect(-210 + col * 145, 40 + ln * 15, 125 * (0.7 + 0.3 * r()), 5);
    c.restore();
  }, 0);
  const globe = sticker(c => {
    c.save(); c.translate(900, 250); c.scale(0.8, 0.8); const g = c.createRadialGradient(-30, -30, 10, 0, 0, 120); g.addColorStop(0, '#6d6a66'); g.addColorStop(1, '#16130f'); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 118, 0, 7); c.fill();
    c.save(); c.clip(); c.fillStyle = 'rgba(235,230,220,0.85)'; for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(-90 + r() * 180, -90 + r() * 180, 18 + r() * 40, 10 + r() * 26, r() * 3, 0, 7); c.fill(); }
    for (let y = -120; y < 120; y += 7) for (let x = -120; x < 120; x += 7) { c.fillStyle = 'rgba(0,0,0,0.22)'; c.beginPath(); c.arc(x, y, 1.6, 0, 7); c.fill(); } c.restore(); c.restore();
  }, 9);
  const rocket = sticker(c => {
    c.save(); c.translate(150, 470); c.rotate(-0.22); c.fillStyle = '#e9e5dc'; c.fillRect(-34, -150, 68, 300); c.fillStyle = '#26221d';
    for (let i = 0; i < 5; i++) c.fillRect(-34, -120 + i * 58, 68, 14); c.beginPath(); c.moveTo(-34, -150); c.lineTo(0, -235); c.lineTo(34, -150); c.fill();
    c.beginPath(); c.moveTo(-34, 90); c.lineTo(-76, 175); c.lineTo(-34, 150); c.fill(); c.beginPath(); c.moveTo(34, 90); c.lineTo(76, 175); c.lineTo(34, 150); c.fill();
    c.fillStyle = '#f0b25a'; c.beginPath(); c.moveTo(-24, 152); c.lineTo(0, 230); c.lineTo(24, 152); c.fill(); c.restore();
  }, 9);
  const cam = sticker(c => {
    c.save(); c.translate(905, 1210); c.rotate(0.1); c.fillStyle = '#1f1d1c'; rr(c, -100, -56, 170, 112, 18); c.fill(); c.beginPath(); c.moveTo(70, -26); c.lineTo(122, -52); c.lineTo(122, 52); c.lineTo(70, 26); c.fill();
    c.fillStyle = '#ff3b3b'; c.beginPath(); c.arc(-68, -22, 11, 0, 7); c.fill(); c.fillStyle = '#fff'; c.font = `800 26px ${UI}`; c.fillText('REC', -50, -12);
    c.fillStyle = '#3b82f6'; c.beginPath(); c.arc(100, 0, 14, 0, 7); c.fill(); c.restore();
  }, 9);
  return (PSTK[head] = { news, globe, rocket, cam });
}
function fxPaper(s, d, h, m, p, o) {
  ctx.drawImage(paperBg(), 0, 0);
  ctx.save(); ctx.translate(540, 760); ctx.rotate(s * 0.25);
  for (let i = 0; i < 28; i++) { ctx.fillStyle = i % 2 ? 'rgba(120,85,45,0.22)' : 'rgba(255,245,220,0.10)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 2000, i * Math.PI / 14, (i + 1) * Math.PI / 14); ctx.fill(); }
  ctx.restore();
  const P = paperStickers(String(o.text || 'BREAKING').toUpperCase()), pop = (img, t0, ax, ay) => { const k = back((s - t0) / 0.2); if (k <= 0) return; ctx.save(); ctx.translate(ax, ay); ctx.scale(k, k); ctx.translate(-ax, -ay); ctx.shadowColor = 'rgba(40,25,10,0.4)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; ctx.drawImage(img, 0, 0); ctx.restore(); };
  pop(P.news, 0.0, 885, 560); pop(P.globe, 0.08, 900, 250); pop(P.rocket, 0.12, 150, 470);
  const ol = L(), oc = ol.getContext('2d');
  for (let i = 0; i < 16; i++) { const an = i * Math.PI / 8; oc.drawImage(m, Math.cos(an) * 15, Math.sin(an) * 15); }
  oc.globalCompositeOperation = 'source-in'; oc.fillStyle = '#fff'; oc.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = 'rgba(40,25,10,0.45)'; ctx.shadowBlur = 26; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 12; ctx.drawImage(ol, 0, 0); ctx.restore();
  ctx.drawImage(m, 0, 0, W, H);
  pop(P.cam, 0.16, 905, 1210);
}

// ---------- 6. spotlight ----------
function fxSpot(s, d, h, m, p, o) {
  ctx.drawImage(h, 0, 0, W, H); ctx.fillStyle = 'rgba(18,9,3,0.8)'; ctx.fillRect(0, 0, W, H);
  const pull = 1 - 0.14 * pullFor() * eo(s / 0.22), fy = H - (H - F.y) * pull, k = eo(s / 0.2), col = o.color || '#efc46a';
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(F.x, fy - 100, 20, F.x, fy - 100, 760); glow.addColorStop(0, `rgba(255,200,120,${0.45 * k})`); glow.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.translate(F.x, fy - 60); ctx.rotate(s * 0.35);
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, w = 0.07 + 0.04 * (i % 3); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1500); g.addColorStop(0, `rgba(255,214,150,${0.26 * k})`); g.addColorStop(1, 'rgba(255,214,150,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1500, a - w, a + w); ctx.fill(); }
  ctx.restore();
  const word = String(o.text || 'Claude'), ts = 1.12 - 0.12 * eo(s / 0.3), fs = fitSize(word, `italic 700 {}px ${SERIF}`, 980, 250), ty = clamp(fy - F.w * pull * 0.35, 260, 900);
